name: quarrel.io Stage 1, 2 and 2.5 checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-1-2-and-25:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Start local Supabase
        run: npm run supabase:start > /tmp/quarrel-supabase-start.log 2>&1
      - run: npm run supabase:env
      - run: npm run test:db
      - name: Start application for integration tests
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3001 > /tmp/quarrel-next.log 2>&1 &
          curl -fsS --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:3001/api/rooms/session > /dev/null
      - run: npm run test:api
      - run: npm run test:supabase
      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop > /tmp/quarrel-supabase-stop.log 2>&1
